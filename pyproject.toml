[project]
name = "ozaki-numpy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13.7"
dependencies = ["marimo>=0.24.0", "numpy>=2.5.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
# Only resolve package versions published at least a week ago, as a buffer
# against compromised releases. Set here, not only in a machine's global uv
# config, so every machine writes the same uv.lock.
exclude-newer = "1 week"
